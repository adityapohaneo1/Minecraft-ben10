<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Omniverse: ZERO</title>
<link rel="stylesheet" href="loading.css">
<style>
  :root{ --green:#39ff8a; --green-dim:#1c7a45; --theme:#39ff8a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:'Segoe UI',Roboto,Consolas,monospace;}

  /* ---------- START SCREEN (title menu) ---------- */
  #start-screen{
    position:fixed;inset:0;z-index:100;display:flex;flex-direction:row;align-items:center;justify-content:center;
    gap:clamp(24px,7vw,90px);color:#eafff2;overflow:hidden;overflow-y:auto;
    background:radial-gradient(ellipse at 50% 28%,#0e4128 0%,#04140d 58%,#000 100%);
    padding:max(env(safe-area-inset-top),14px) max(env(safe-area-inset-right),24px) max(env(safe-area-inset-bottom),14px) max(env(safe-area-inset-left),24px);
    opacity:0;transition:opacity .6s ease;
  }
  #start-screen.show{opacity:1;}
  #start-screen::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(57,255,138,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,138,.08) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:linear-gradient(#000,transparent 88%);mask-image:linear-gradient(#000,transparent 88%);pointer-events:none;}
  .lobby-left,.lobby-right{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;}
  .lobby-right{flex:0 1 300px;min-width:0;}
  #logo-hex{width:clamp(48px,14vh,92px);height:clamp(48px,14vh,92px);filter:drop-shadow(0 0 12px rgba(57,255,138,.7));margin-bottom:2px;position:relative;}
  #start-screen h1{font-size:clamp(24px,7.2vh,46px);letter-spacing:clamp(2px,.8vw,7px);margin:0;color:var(--green);text-shadow:0 0 16px rgba(57,255,138,.6);text-align:center;line-height:1.05;display:flex;flex-direction:column;align-items:center;position:relative;}
  #start-screen h1 span{font-size:.62em;letter-spacing:.7em;margin-right:-.7em;color:#fff;text-shadow:0 0 14px #39ff8a,0 0 30px rgba(57,255,138,.5);margin-top:4px;}
  #start-screen .sub{letter-spacing:6px;font-size:11px;opacity:.75;margin:2px 0 20px;position:relative;color:#bfffe0;}
  .menu-btn{
    position:relative;width:min(280px,100%);padding:clamp(9px,2.6vh,15px) 0;margin:clamp(4px,1.2vh,7px) 0;font-size:clamp(12px,3vh,15px);
    background:linear-gradient(180deg,rgba(25,80,52,.9),rgba(6,26,17,.95));border:1px solid var(--green);color:var(--green);font-weight:700;letter-spacing:2px;font-family:inherit;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  }
  .menu-btn:active{background:linear-gradient(180deg,#2a8a58,#0c3a24);color:#fff;}
  .menu-btn.primary{background:linear-gradient(180deg,#39ff8a,#12a458);color:#022012;border-color:#aaffd0;box-shadow:0 0 18px rgba(57,255,138,.45);}
  #menu-panel{display:none;max-width:min(300px,100%);font-size:12px;line-height:1.6;opacity:.85;text-align:center;margin-top:14px;max-height:34vh;overflow-y:auto;}
  #menu-panel.show{display:block;}
  .qrow{display:flex;gap:8px;justify-content:center;margin-top:8px;}
  .qbtn{padding:6px 14px;border:1px solid var(--green-dim);color:#9fe;background:#0a140f;font-size:12px;letter-spacing:1px;}
  .qbtn.active{background:var(--green-dim);color:#fff;}
  #start-screen.leaving{opacity:0;transition:opacity .3s ease;}
</style>
</head>
<body>
<div id="ld"><div class="ld-bg"></div><img class="ld-img" id="ld-img" alt=""><div class="ld-scrim"></div>
  <div class="ld-ui"><div class="ld-row"><span id="ld-msg">LOADING</span><span id="ld-pct">0%</span></div><div class="ld-bar"><div class="ld-fill" id="ld-fill"></div></div></div>
  <div class="ld-err" id="ld-err"></div></div>
<script src="loading.js"></script>

<div id="start-screen">
  <div class="lobby-left">
    <svg id="logo-hex" viewBox="0 0 100 100"><polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="#03130c" stroke="#39ff8a" stroke-width="5"/><path d="M30 26h40L54 50l16 24H30l16-24z" fill="#39ff8a"/><path d="M36 30h28L50 48z M36 70h28L50 52z" fill="#03130c"/></svg>
    <h1>OMNIVERSE<span>ZERO</span></h1>
    <div class="sub">CHOOSE YOUR FORM</div>
  </div>
  <div class="lobby-right">
    <button class="menu-btn primary" id="btn-start">PLAY</button>
    <button class="menu-btn" id="btn-settings">SETTINGS</button>
    <button class="menu-btn" id="btn-controls">HOW TO PLAY</button>
    <button class="menu-btn" id="btn-about">ABOUT</button>
    <div id="menu-panel"></div>
  </div>
</div>

<script src="audio.js"></script>
<script>
/* =========================================================================
   START PAGE
   1. Boot loading screen (silent): wait until the title music + click sound are decoded.
   2. Title menu: title music plays here ONLY. PLAY goes to game.html, which has its own loading screen,
      so the title music and the in-game music can never overlap.
========================================================================= */
(function(){
'use strict';
const $=id=>document.getElementById(id);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const MIN_BOOT=1600;                                   // the studio / logo screen is always shown at least this long

/* ---- settings shared with the game (same storage key game.html reads) ---- */
const KEY='omniverse_settings_v1';
function readS(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; return {quality:s.quality||'MEDIUM',omni:s.omni!==false,perf:!!s.perf}; }catch(e){ return {quality:'MEDIUM',omni:true,perf:false}; } }
function saveS(s){ try{ localStorage.setItem(KEY,JSON.stringify(s)); }catch(e){} }

/* ---- boot ---- */
LD.set(0.04,'LOADING');
LD.art('loading/boot');
const names=['title','uiclick'];
Audio_.preload(names,(d,n)=>{ LD.set(.08+.88*d/n); }).then(async()=>{
  await LD.finish(MIN_BOOT);                           // bar to 100%, hold for MIN_BOOT, fade out
  $('start-screen').classList.add('show');
  Audio_.music('title');                               // plays now if the browser allows it, otherwise on the first tap
}).catch(e=>LD.error('ERROR: '+(e&&e.message||e)));

/* ---- menu ---- */
const panel=$('menu-panel');
function showPanel(html){ panel.innerHTML=html; panel.classList.add('show'); }
$('btn-controls').addEventListener('click',()=>{ Audio_.click(); showPanel(
  isTouch
  ? 'LEFT: joystick to move.<br>RIGHT SIDE: swipe to look around.<br>Swipe the alien portrait (top-left) to switch aliens, tap it to revert to Ben.<br>Big button = Attack (hold = place block). Arrow button = Jump. Bolt button = Special.<br>VEHICLES: walk up to a car and tap ENTER VEHICLE (left side)'
  : 'WASD to move, mouse to look (click to lock).<br>Left click = Attack, Right click = Place block.<br>F = Attack, G = Place, Space = Jump, E/R/T/Y = alien actions, Q = Revert to Ben, V = enter/exit vehicle (Space = handbrake). L / Tab / middle-click = Lock-on. Fly/swim: look up or down while moving.'
); });
$('btn-about').addEventListener('click',()=>{ Audio_.click(); showPanel('OMNIVERSE: ZERO — an original fan-made prototype blending a Minecraft-style voxel world with Ben 10 Alien Force-inspired transformation and combat mechanics. All characters, names and visuals here are original interpretations.'); });
$('btn-settings').addEventListener('click',()=>{
  Audio_.click(); const S=readS();
  panel.innerHTML='<div>GRAPHICS QUALITY</div><div class="qrow" id="q-row"></div><div style="margin-top:14px">OMNITRIX TIMER</div><div class="qrow" id="o-row"></div><div style="margin-top:14px">PERFORMANCE STATS</div><div class="qrow" id="p-row"></div>';
  panel.classList.add('show');
  function row(id,opts,cur,apply){ const host=$(id); opts.forEach(([label,val])=>{ const b=document.createElement('div'); b.className='qbtn'+(cur===val?' active':''); b.textContent=label;
    b.addEventListener('click',()=>{ Audio_.click(); [...host.children].forEach(c=>c.classList.remove('active')); b.classList.add('active'); const s=readS(); apply(s,val); saveS(s); }); host.appendChild(b); }); }
  row('q-row',[['LOW','LOW'],['MEDIUM','MEDIUM'],['HIGH','HIGH']],S.quality,(s,v)=>{ s.quality=v; });
  row('o-row',[['ON',true],['OFF',false]],S.omni,(s,v)=>{ s.omni=v; });
  row('p-row',[['OFF',false],['ON',true]],S.perf,(s,v)=>{ s.perf=v; });
});

/* ---- PLAY: click sound, fade the title music out, go to the game page (its own loading screen) ---- */
let going=false;
$('btn-start').addEventListener('click',()=>{
  if(going) return; going=true; Audio_.click(); Audio_.music('none'); $('start-screen').classList.add('leaving');
  setTimeout(()=>{ location.href='game.html'; },420);
});
})();
</script>
</body>
</html>
